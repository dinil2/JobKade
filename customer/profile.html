<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — JobKade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header"><h1>My Profile</h1><p>Manage your personal details and account security.</p></div>

      <div class="profile-form-card" style="max-width:640px;">
        <div class="profile-form-header">
          <div class="avatar-wrapper-relative">
            <div class="avatar-upload-container" id="customer-avatar-clickable" title="Click on profile image to upload new photo">
              <img id="customer-avatar-img" class="avatar-img-preview" src="" alt="Customer Photo" style="display:none;">
              <div class="avatar-initials-fallback avatar-blue" id="customer-avatar-initials">D</div>
              <div class="avatar-hover-scrim">
                <i data-lucide="camera" width="24" height="24"></i>
                <span style="font-size:0.7rem; font-weight:700; margin-top:4px; letter-spacing:0.5px; text-transform:uppercase;">Change</span>
              </div>
            </div>
            <button type="button" id="btn-customer-camera-trigger" class="avatar-camera-btn" aria-label="Upload Photo" title="Click to upload profile photo">
              <i data-lucide="camera" width="16" height="16"></i>
            </button>
            <input type="file" id="customer-photo-upload" accept="image/png, image/jpeg, image/jpg, image/webp" style="display:none;">
          </div>
          <div>
            <h3 id="customer-profile-name-heading">Dinil Sandaruwan</h3>
            <p class="text-sm text-secondary" id="customer-profile-email-heading">dinil@email.com</p>
            <span style="font-size:0.78rem; color:var(--text-secondary); cursor:pointer; margin-top:4px; display:inline-block;" id="customer-avatar-hint">
              <i data-lucide="upload" width="12" height="12" style="vertical-align:middle; margin-right:3px;"></i> Click photo to change
            </span>
          </div>
        </div>

        <form id="customer-profile-form">
          <h4 style="margin: 16px 0 12px; font-size: 1rem; color: var(--text-primary);"><i data-lucide="user" width="16" height="16" style="display:inline;vertical-align:middle;color:var(--primary);margin-right:4px;"></i> Personal Information</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" id="customer-name-input" class="form-input" value="Dinil Sandaruwan" required>
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" id="customer-phone-input" class="form-input" value="+94 77 123 4567" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" id="customer-email-input" class="form-input" value="dinil@email.com" readonly style="background:var(--bg-alt); opacity:0.85;">
          </div>
          <div class="form-group">
            <label class="form-label">Location / Address</label>
            <input type="text" id="customer-address-input" class="form-input" value="Colombo 05" placeholder="e.g. Colombo 05, Western Province">
          </div>

          <h4 style="margin: 24px 0 12px; font-size: 1rem; color: var(--text-primary);"><i data-lucide="lock" width="16" height="16" style="display:inline;vertical-align:middle;color:var(--warning);margin-right:4px;"></i> Security & Password (Optional)</h4>
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" id="customer-current-password" class="form-input" placeholder="Leave blank if not changing">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" id="customer-new-password" class="form-input" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="customer-confirm-password" class="form-input" placeholder="Confirm new password">
            </div>
          </div>

          <div style="margin-top: 24px;">
            <button type="submit" id="btn-save-customer-profile" class="btn btn-primary"><i data-lucide="save" width="18" height="18"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
