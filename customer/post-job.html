<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — JobKade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <!-- Leaflet.js Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header"><h1>Post a New Job</h1><p>Describe what you need and verified workers will see your request.</p></div>

      <div class="profile-form-card" style="max-width: 700px;">
        <form id="job-post-form">
          <div class="form-group">
            <label class="form-label">Job Title <span>*</span></label>
            <input type="text" id="job-title" name="job-title" class="form-input" placeholder="e.g. AC leaking water" required>
          </div>

          <div class="form-group">
            <label class="form-label">Category <span>*</span></label>
            <select id="job-category" name="job-category" class="form-select" required>
              <option value="" selected disabled>Select a category</option>
              <option value="1">Electrical</option><option value="2">Plumbing</option><option value="3">AC Repair</option><option value="4">Painting</option><option value="5">Carpentry</option><option value="6">Masonry</option><option value="7">Cleaning</option><option value="8">Appliance Repair</option><option value="9">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Description <span>*</span></label>
            <textarea id="job-description" name="job-description" class="form-textarea" placeholder="Describe the problem or job in detail..." required></textarea>
          </div>

          <div class="form-group">
            <div class="flex justify-between items-center mb-1">
              <label class="form-label" style="margin-bottom:0;">Job Location <span>*</span></label>
              <button type="button" id="btn-use-location" class="btn btn-outline btn-sm" style="padding:4px 10px; font-size:0.75rem; display:inline-flex; align-items:center; gap:6px;">
                <i data-lucide="crosshair" width="14" height="14"></i> Use My Current Location
              </button>
            </div>
            <div style="position:relative;">
              <input type="text" id="job-location-address" class="form-input" placeholder="e.g. Colombo 05, Havelock Road" required>
              <span id="geo-status-indicator" style="display:none; position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:0.75rem; color:var(--primary); font-weight:500;">
                <i data-lucide="loader" width="14" height="14" class="spin" style="display:inline; vertical-align:middle;"></i> Locating...
              </span>
            </div>
            
            <!-- Interactive Leaflet Map for Job Location Picker -->
            <div style="margin-top: 10px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
              <div id="job-location-map" style="height: 260px; width: 100%; background: #e2e8f0; z-index: 1;"></div>
              <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-light); border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-secondary);">
                <span><i data-lucide="map-pin" width="12" height="12" style="display:inline; vertical-align:middle; color:var(--primary);"></i> Click map or drag marker to set exact job location</span>
                <span id="coord-display" style="font-family: monospace; font-weight: 600; color: var(--text);">6.92710° N, 79.86120° E</span>
              </div>
            </div>
            <input type="hidden" id="job-latitude" name="latitude" value="6.9271000">
            <input type="hidden" id="job-longitude" name="longitude" value="79.8612000">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Preferred Date</label>
              <input type="date" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Preferred Time</label>
              <input type="time" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Upload Fault Photos</label>
            <label class="file-upload">
              <div class="file-upload-icon-circle">
                <i data-lucide="camera" width="24" height="24"></i>
              </div>
              <p class="file-upload-title">Click to upload photos of the issue</p>
              <span class="file-types">JPG, PNG (Max 5 images &bull; 5MB each)</span>
              <input type="file" id="job-images" accept=".jpg,.jpeg,.png" multiple>
            </label>
            <div id="image-preview-grid" class="image-preview-grid"></div>
          </div>

          <div class="info-notice mb-3">
            <i data-lucide="info"></i>
            <span>Your job request will only be visible to verified workers who have access to customer requests.</span>
          </div>

          <button type="submit" class="btn btn-primary btn-lg"><i data-lucide="send" width="18" height="18"></i> Post Job Request</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
