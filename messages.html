<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — JobKade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="css/messages.css">
  <style>
    /* Prevent guest flash before authentication verification */
    body.messages-page {
      display: none;
    }
  </style>
  <script>
    (function () {
      try {
        var token = localStorage.getItem('jobkade_token');
        var userStr = localStorage.getItem('jobkade_user');
        if (!token || !userStr) {
          var returnUrl = 'messages.html' + window.location.search;
          window.location.replace('auth/login.html?redirect=' + encodeURIComponent(returnUrl));
          return;
        }
        var user = JSON.parse(userStr);
        if (user && user.role && user.role.toLowerCase() === 'admin') {
          window.location.replace('admin/dashboard.html');
          return;
        }
        // Valid worker or customer session
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.display = 'block';
        });
      } catch (e) {
        window.location.replace('auth/login.html?redirect=' + encodeURIComponent('messages.html' + window.location.search));
      }
    })();
  </script>
</head>
<body class="messages-page">
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main messages-main">
      <div class="dashboard-header messages-header">
        <h1>Direct In-App Messages</h1>
        <p>Instant communication between verified service workers and customers.</p>
      </div>

      <!-- Real-Time Two-Column Chat Container -->
      <div class="chat-container">
        
        <!-- Left: Conversations List -->
        <div class="chat-conversations">
          <div class="conversations-header">
            <h2><i data-lucide="messages-square" width="20" height="20" style="color:var(--primary);"></i> Chats</h2>
            <div class="conversations-search">
              <i data-lucide="search" width="16" height="16"></i>
              <input type="text" id="search-conversations" placeholder="Search conversations...">
            </div>
          </div>
          <ul class="conversations-list" id="conversations-list">
            <div style="padding: 24px; text-align: center; color: var(--text-muted);">
              <i data-lucide="loader" width="24" height="24" class="spin" style="margin: 0 auto 8px; display:block;"></i>
              Loading conversations...
            </div>
          </ul>
        </div>

        <!-- Right: Active Chat Thread Window -->
        <div class="chat-window">
          <!-- Chat Header -->
          <div class="chat-header">
            <div class="chat-header-user">
              <button class="chat-back-btn" id="chat-back-btn" title="Back to chats">
                <i data-lucide="arrow-left" width="20" height="20"></i>
              </button>
              <div id="chat-header-user" style="display:flex; align-items:center; gap:12px;">
                <div class="avatar avatar-sm avatar-blue">?</div>
                <div>
                  <div class="chat-header-name">Select a conversation</div>
                  <div class="chat-header-status" style="color:var(--text-muted);">Pick a contact from the left</div>
                </div>
              </div>
            </div>
            <div class="chat-header-actions" id="chat-header-actions">
              <!-- Phone & WhatsApp buttons populated dynamically -->
            </div>
          </div>

          <!-- Optional Job Context Banner -->
          <div class="chat-job-banner" id="chat-job-banner" style="display: none;"></div>

          <!-- Message Stream -->
          <div class="chat-messages" id="chat-messages">
            <div class="chat-empty-state">
              <div class="chat-empty-icon"><i data-lucide="message-square" width="32" height="32"></i></div>
              <h3>No conversations yet</h3>
              <p>Find a worker and start chatting.</p>
            </div>
          </div>

          <!-- Message Input Bar -->
          <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Type a message here... (Press Enter to send)" autocomplete="off">
            <button class="btn-send" id="btn-send" title="Send message">
              <i data-lucide="send" width="18" height="18"></i>
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
