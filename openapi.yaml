openapi: 3.0.3
info:
  title: JobKade REST API Specification
  description: |
    # JobKade On-Demand Household Services & Maintenance Marketplace
    
    Cardiff Metropolitan University / ICBT Computing Project CSE5015.
    
    This specification documents every endpoint across the 12 core API controllers in `api/`:
    - **Auth**: User authentication, registration, session profile, and password updates.
    - **Admin**: Administrative metrics, analytics, user lifecycle, KYC verification, and promotions.
    - **Categories**: Household service categories and trades.
    - **Jobs**: Open service marketplace jobs, worker proposals, invoicing, and invoice settlements.
    - **KYC**: Worker verification document submissions and status badges.
    - **Messages**: Direct real-time messaging between customers and workers.
    - **Notifications**: Automated system and transaction alerts.
    - **Promotions**: Worker service deals and discount offerings.
    - **Reviews**: Customer ratings, reviews, and worker satisfaction scores.
    - **Subscriptions**: Worker monthly/annual membership plans and digital payment receipts.
    - **Wallet**: Commission tracking, balance top-ups, access pass activation, and bank payouts.
    - **Workers**: Directory search by geo-coordinates, trade categories, profiles, and custom service packages.
    
    ---
    ### Role Access Model:
    - **Public**: Accessible without credentials.
    - **Customer**: Requires valid JWT token for a customer account.
    - **Worker**: Requires valid JWT token for a worker account.
    - **Admin**: Requires valid JWT token for an administrator account.
    
    ### JWT Bearer Authentication:
    To test authenticated endpoints:
    1. Send a request to `POST /auth.php?action=login` (e.g. with `admin@jobkade.lk` / `admin@123` or your customer/worker credentials).
    2. Copy the `token` string from the JSON response.
    3. Click the green **Authorize** button at the top right of this Swagger UI page.
    4. Paste the token into the `bearerAuth` dialog and click **Authorize**.
  version: 1.0.0
servers:
  - url: http://localhost/JobKade/api
    description: Local WAMP Server (Default)
  - url: http://localhost:8000/api
    description: Local PHP Development Server (Port 8000)
  - url: ./api
    description: Relative API Path
tags:
  - name: Auth
    description: Authentication, Registration, and User Profile Management
  - name: Admin
    description: System Administration, Analytics, User Management & KYC Moderation
  - name: Categories
    description: Service Category Catalog
  - name: Jobs
    description: Job Requests, Bidding Proposals, Invoicing & Settlement
  - name: KYC
    description: Worker Identity Verification Documents & Status
  - name: Messages
    description: In-App Messaging & Conversation History
  - name: Notifications
    description: User Notifications & Alerts
  - name: Promotions
    description: Worker Deals & Promotional Discounts
  - name: Reviews
    description: Customer Reviews & Ratings
  - name: Subscriptions
    description: Worker Membership Subscriptions & Payment Receipts
  - name: Wallet
    description: Worker Financial Wallet, Commission Deductions & Payouts
  - name: Workers
    description: Worker Directory, Geolocation Search, Profiles & Custom Services

paths:
  # ==========================================
  # AUTH
  # ==========================================
  /auth.php?action=register:
    post:
      tags:
        - Auth
      summary: Register a new user (Customer or Worker)
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Registers a customer or worker account. If registering as a worker, `nic` is mandatory, and verification documents (`nic_document`, `police_report`, `qualification_document`) may be provided as file uploads or pre-uploaded paths.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - phone
              properties:
                full_name:
                  type: string
                  example: Sunil Perera
                email:
                  type: string
                  format: email
                  example: sunil.electric@gmail.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: worker@123
                phone:
                  type: string
                  example: "+94771234567"
                username:
                  type: string
                  example: sunilp
                role:
                  type: string
                  enum: [customer, worker]
                  default: customer
                  example: worker
                nic:
                  type: string
                  description: Mandatory if role is worker
                  example: 198512345678
                bio:
                  type: string
                  example: Licensed electrician with over 10 years of domestic & commercial wiring experience.
                address:
                  type: string
                  example: 124 Galle Road, Colombo 03
                working_hours:
                  type: string
                  example: 8:00 AM - 6:00 PM
                category_id:
                  type: integer
                  example: 1
                service:
                  type: string
                  example: electrical
          multipart/form-data:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - phone
              properties:
                full_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
                username:
                  type: string
                role:
                  type: string
                  enum: [customer, worker]
                nic:
                  type: string
                bio:
                  type: string
                address:
                  type: string
                category_id:
                  type: integer
                nic_document:
                  type: string
                  format: binary
                  description: Scanned NIC or Driver's license document (PDF/PNG/JPG, max 5MB)
                police_report:
                  type: string
                  format: binary
                  description: Optional Police clearance report (PDF/PNG/JPG, max 5MB)
                qualification_document:
                  type: string
                  format: binary
                  description: Optional trade qualification certificate (PDF/PNG/JPG, max 5MB)
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '409':
          $ref: '#/components/responses/409Conflict'

  /register.php:
    post:
      tags:
        - Auth
      summary: Direct endpoint for user registration
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Direct alias routing directly to `AuthController::register()`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - phone
              properties:
                full_name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  example: jane@gmail.com
                password:
                  type: string
                  example: secret123
                phone:
                  type: string
                  example: "+94711122334"
                role:
                  type: string
                  enum: [customer, worker]
                  default: customer
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  /auth.php?action=login:
    post:
      tags:
        - Auth
      summary: Authenticate user & issue JWT token
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Logs in a registered user and returns an authentication payload containing a signed JWT token valid for subsequent authorized requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@jobkade.lk
                password:
                  type: string
                  format: password
                  example: admin@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /login.php:
    post:
      tags:
        - Auth
      summary: Direct endpoint for user login
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Direct alias routing directly to `AuthController::login()`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: customer@gmail.com
                password:
                  type: string
                  example: customer@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'

  /auth.php?action=me:
    get:
      tags:
        - Auth
      summary: Get currently authenticated user details
      description: |
        **Allowed Role**: Customer, Worker, or Admin (Bearer token required)
        
        Returns the full profile and settings for the token holder. Includes `worker_profile` data when the caller is a registered worker.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth.php?action=update-profile:
    post:
      tags:
        - Auth
      summary: Update profile information
      description: |
        **Allowed Role**: Customer, Worker, or Admin (Bearer token required)
        
        Updates personal profile fields for the authenticated user account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: Sunil R. Perera
                phone:
                  type: string
                  example: "+94779876543"
                address:
                  type: string
                  example: 54 Temple Road, Colombo 10
                notification_prefs:
                  type: object
                  example:
                    email_alerts: true
                    sms_alerts: false
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile updated successfully!
                  user:
                    $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth.php?action=change-password:
    post:
      tags:
        - Auth
      summary: Change account password
      description: |
        **Allowed Role**: Customer, Worker, or Admin (Bearer token required)
        
        Validates the existing password and replaces it with a new hashed password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                  example: worker@123
                new_password:
                  type: string
                  format: password
                  minLength: 6
                  example: workerNewPass#2026
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth.php?action=upload-photo:
    post:
      tags:
        - Auth
      summary: Upload user profile picture
      description: |
        **Allowed Role**: Customer, Worker, or Admin (Bearer token required)
        
        Uploads an avatar picture via `multipart/form-data` or base64 JSON payload. Max file size: 2MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: Profile image file (JPG/JPEG/PNG, max 2MB)
          application/json:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  description: Base64 data URL encoded image string
                  example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
      responses:
        '200':
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile picture updated successfully!
                  photo_url:
                    type: string
                    example: uploads/profiles/profile_3_abc123.jpg
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # ==========================================
  # ADMIN
  # ==========================================
  /admin.php?action=stats:
    get:
      tags:
        - Admin
      summary: Administrative system activity statistics
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Returns real-time dashboard KPIs including user counts, worker verification statuses, job metrics, KYC queue sizes, and total platform revenue.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  stats:
                    type: object
                    properties:
                      total_users:
                        type: integer
                        example: 24
                      total_workers:
                        type: integer
                        example: 10
                      verified_workers:
                        type: integer
                        example: 6
                      total_jobs:
                        type: integer
                        example: 15
                      pending_kyc:
                        type: integer
                        example: 3
                      approved_kyc:
                        type: integer
                        example: 5
                      rejected_kyc:
                        type: integer
                        example: 1
                      total_revenue_lkr:
                        type: number
                        example: 32500.00
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=analytics:
    get:
      tags:
        - Admin
      summary: Comprehensive marketplace analytics
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Returns aggregated analytical metrics, category distribution percentages, user growth curves, and revenue breakdowns.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  analytics:
                    type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=kyc-pending:
    get:
      tags:
        - Admin
      summary: Get all pending worker KYC verification requests
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Retrieves workers with unapproved document packets awaiting administrative compliance verification.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending KYC queue retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pending_kyc:
                    type: array
                    items:
                      $ref: '#/components/schemas/KycDocumentItem'
                  count:
                    type: integer
                    example: 3
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=kyc-counts:
    get:
      tags:
        - Admin
      summary: Get counts of KYC documents by verification status
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Returns total document counts grouped by status (`pending`, `approved`, `rejected`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: KYC document counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  counts:
                    type: object
                    properties:
                      pending:
                        type: integer
                        example: 3
                      approved:
                        type: integer
                        example: 8
                      rejected:
                        type: integer
                        example: 1
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=kyc-list:
    get:
      tags:
        - Admin
      summary: List KYC documents filtered by status
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Retrieves all worker KYC documents filtered by verification status (`pending`, `approved`, or `rejected`).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
          description: Filter verification status
      responses:
        '200':
          description: Filtered KYC document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/KycDocumentItem'
                  count:
                    type: integer
                    example: 5
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=kyc-packet:
    get:
      tags:
        - Admin
      summary: Inspect full verification dossier for a worker
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Loads all submitted identification files, trade certificates, and worker bio for comprehensive compliance review.
      security:
        - bearerAuth: []
      parameters:
        - name: worker_id
          in: query
          required: true
          schema:
            type: integer
          description: Target worker profile ID
          example: 1
      responses:
        '200':
          description: Worker KYC packet loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  worker_id:
                    type: integer
                    example: 1
                  profile:
                    type: object
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/KycDocumentItem'
                  count:
                    type: integer
                    example: 2
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=kyc-verify:
    post:
      tags:
        - Admin
      summary: Approve or reject worker KYC verification
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Approves or rejects an individual KYC document or an entire worker dossier. Approving assigns the verified worker badge and unlocks job applications.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                kyc_id:
                  type: integer
                  description: KYC document record ID
                  example: 1
                worker_id:
                  type: integer
                  description: Required when verifying packet
                  example: 1
                verify_packet:
                  type: boolean
                  description: Set true to approve/reject all documents for the worker
                  example: true
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
                notes:
                  type: string
                  description: Administrative feedback or reason for rejection
                  example: Valid NIC document and verified criminal history clearance.
      responses:
        '200':
          description: KYC review recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=users:
    get:
      tags:
        - Admin
      summary: List all registered platform users
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Returns all customers, workers, and administrators with account status flags.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User directory retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDetail'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=toggle-user:
    post:
      tags:
        - Admin
      summary: Suspend or activate a user account
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Toggles user status between `active` and `suspended`. Suspended users are immediately denied login.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - status
              properties:
                user_id:
                  type: integer
                  example: 5
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=payments:
    get:
      tags:
        - Admin
      summary: View platform subscription payment ledger
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Lists all worker subscription payments and financial transactions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment transactions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payments:
                    type: array
                    items:
                      type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=promos:
    get:
      tags:
        - Admin
      summary: Get pending promotional discounts for approval
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Lists worker promotional submissions awaiting review.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending promotions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pending_promotions:
                    type: array
                    items:
                      type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /admin.php?action=review-promo:
    post:
      tags:
        - Admin
      summary: Moderate worker promotional campaign
      description: |
        **Allowed Role**: Admin (Bearer token required)
        
        Approves or rejects a submitted worker promotional discount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - promotion_id
                - status
              properties:
                promotion_id:
                  type: integer
                  example: 1
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        '200':
          description: Promotion moderation outcome recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          $ref: '#/components/responses/403Forbidden'

  # ==========================================
  # CATEGORIES
  # ==========================================
  /categories.php:
    get:
      tags:
        - Categories
      summary: Retrieve all household service categories
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Returns the platform trade categories (Electrical, Plumbing, AC Repair, Painting, Carpentry, Masonry, Cleaning, Appliance Repair, etc.).
      responses:
        '200':
          description: Category catalog retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Electrical & Wiring
                        icon:
                          type: string
                          example: zap
                        description:
                          type: string
                          example: Certified residential wiring, socket fixing, and switchboard repairs.

  # ==========================================
  # JOBS
  # ==========================================
  /jobs.php?action=list:
    get:
      tags:
        - Jobs
      summary: Browse open maintenance jobs
      description: |
        **Allowed Role**: Public or Worker (Optional Bearer token)
        
        Lists open customer maintenance jobs. If called by a verified worker with active job access pass or active subscription, unmasked customer contact numbers are provided.
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter jobs by category ID
          example: 1
      responses:
        '200':
          description: Open jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  has_job_access:
                    type: boolean
                    example: true
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobItem'

  /jobs.php?action=create:
    post:
      tags:
        - Jobs
      summary: Post a new job request
      description: |
        **Allowed Role**: Customer (Bearer token required)
        
        Allows a customer to broadcast a household repair or maintenance request with geographic coordinates.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - category_id
                - address
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 150
                  example: Circuit breaker tripping in living room
                description:
                  type: string
                  minLength: 10
                  maxLength: 3000
