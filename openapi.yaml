    get:
      tags:
        - Wallet
      summary: Get worker wallet balance & commission status
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Returns current wallet balance, cumulative earnings, total commission paid, subscription status, and commission rate (5% vs 10%).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet balance summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  wallet:
                    type: object
                    properties:
                      worker_id:
                        type: integer
                        example: 1
                      wallet_balance:
                        type: number
                        example: 12450.00
                      total_earnings:
                        type: number
                        example: 45000.00
                      total_commission_paid:
                        type: number
                        example: 2250.00
                      has_job_access:
                        type: boolean
                        example: true
                      is_subscribed:
                        type: boolean
                        example: true
                      commission_rate:
                        type: number
                        example: 0.05
                      commission_percentage:
                        type: string
                        example: "5%"
                      subscription_plan_name:
                        type: string
                        example: Pro Monthly
                      transactions:
                        type: array
                        items:
                          type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /wallet.php?action=transactions:
    get:
      tags:
        - Wallet
      summary: Get worker transaction history
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Returns the last 30 ledger transactions (online job earnings, cash commission debits, access pass payments, top-ups, and bank payouts).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  transactions:
                    type: array
                    items:
                      type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /wallet.php?action=activate-access:
    post:
      tags:
        - Wallet
      summary: Activate one-time lifetime job viewing access pass
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Activates lifetime customer job board access pass (LKR 1,500.00), allowing worker to view unmasked customer telephone contacts on open jobs.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: string
                  default: "Online IPG (Card/Visa/Master)"
                  example: "Online IPG (Card/Visa/Master)"
      responses:
        '200':
          description: Job access activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: One-time job access pass activated! You can now view all open jobs and customer contacts.
                  has_job_access:
                    type: boolean
                    example: true
                  transaction_ref:
                    type: string
                    example: TXN-ACCESS-202610-12
        '403':
          $ref: '#/components/responses/403Forbidden'

  /wallet.php?action=request-payout:
    post:
      tags:
        - Wallet
      summary: Request bank payout of earned wallet balance
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Initiates a bank transfer payout from available balance to a Sri Lankan bank account. Minimum withdrawal: LKR 1,000.00.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - bank_name
                - account_number
                - account_name
              properties:
                amount:
                  type: number
                  minimum: 1000
                  example: 5000.00
                bank_name:
                  type: string
                  example: Commercial Bank of Ceylon
                account_number:
                  type: string
                  example: 8001234567
                account_name:
                  type: string
                  example: S. P. Sunil Perera
                branch:
                  type: string
                  example: Kollupitiya Branch
      responses:
        '200':
          description: Payout request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Payout request submitted successfully! Funds will be transferred within 1-2 business days.
                  payout_id:
                    type: integer
                    example: 3
                  amount:
                    type: number
                    example: 5000.00
                  wallet_balance:
                    type: number
                    example: 7450.00
                  transaction_ref:
                    type: string
                    example: TXN-WDR-202610-33
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /wallet.php?action=top-up:
    post:
      tags:
        - Wallet
      summary: Top-up wallet balance
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Deposits funds into the wallet (e.g. to clear a negative balance after collecting cash jobs). Minimum amount: LKR 100.00.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  minimum: 100
                  example: 1500.00
                payment_method:
                  type: string
                  default: online
                  example: online
      responses:
        '200':
          description: Wallet topped up successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Wallet topped up successfully by Rs. 1,500.00
                  wallet_balance:
                    type: number
                    example: 8950.00
                  transaction_ref:
                    type: string
                    example: TXN-TOP-202610-44
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  # ==========================================
  # WORKERS
  # ==========================================
  /workers.php?action=search:
    get:
      tags:
        - Workers
      summary: Search workers by category & GPS geolocation
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Calculates Haversine distance between customer coordinates and worker addresses, returning nearby qualified service professionals sorted by proximity and ratings.
      parameters:
        - name: lat
          in: query
          required: false
          schema:
            type: number
          description: Customer latitude (e.g. Colombo 6.9271)
          example: 6.9271
        - name: lng
          in: query
          required: false
          schema:
            type: number
          description: Customer longitude (e.g. Colombo 79.8612)
          example: 79.8612
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
          description: Trade Category ID (1=Electrical, 2=Plumbing, etc.)
          example: 1
      responses:
        '200':
          description: Worker search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    example: 5
                  workers:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerProfileItem'

  /workers.php?action=profile:
    get:
      tags:
        - Workers
      summary: View public worker profile
      description: |
        **Allowed Role**: Public (No authentication required)
        
        Returns verified worker information, trades, bio, experience, average rating, and service catalog.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: Worker ID
          example: 1
      responses:
        '200':
          description: Worker profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  worker:
                    $ref: '#/components/schemas/WorkerProfileItem'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workers.php?action=update:
    post:
      tags:
        - Workers
      summary: Update worker trade profile & service area
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Updates bio, travel radius (km), contact number, and work base address.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  maxLength: 2000
                  example: Master electrician with 12 years of commercial & home wiring expertise.
                service_radius_km:
                  type: integer
                  minimum: 1
                  maximum: 150
                  example: 25
                full_name:
                  type: string
                  example: Sunil R. Perera
                phone:
                  type: string
                  example: "+94771234567"
                address:
                  type: string
                  example: Colombo 03, Western Province
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /workers.php?action=add-service:
    post:
      tags:
        - Workers
      summary: Add a custom service offering
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Creates a custom package in the worker portfolio with transparent pricing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 3
                  example: Full House Wiring Safety Inspection
                description:
                  type: string
                  example: Insulation resistance testing, circuit breaker evaluation, and electrical safety certificate issuance.
                price:
                  type: number
                  minimum: 100
                  default: 1500.00
                  example: 3500.00
                pricing_type:
                  type: string
                  enum: [hourly, fixed, starting_at]
                  default: hourly
                  example: fixed
                category_id:
                  type: integer
                  example: 1
                location:
                  type: string
                  example: Colombo & Gampaha Districts
                images:
                  type: array
                  items:
                    type: string
                  example: ["uploads/services/inspection.jpg"]
      responses:
        '201':
          description: Service package created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service created successfully.
                  service_id:
                    type: integer
                    example: 8
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /workers.php?action=my-services:
    get:
      tags:
        - Workers
      summary: List current worker custom services
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Returns all service listings published by the authenticated worker.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Custom services list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  services:
                    type: array
                    items:
                      type: object
        '403':
          $ref: '#/components/responses/403Forbidden'

  /workers.php?action=delete-service:
    post:
      tags:
        - Workers
      summary: Delete a custom service listing
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Removes an existing service package from the worker's profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
              properties:
                service_id:
                  type: integer
                  example: 8
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workers.php?action=upload-photo:
    post:
      tags:
        - Workers
      summary: Upload worker profile photo
      description: |
        **Allowed Role**: Worker (Bearer token required)
        
        Direct alias to update the worker avatar photo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
      responses:
        '200':
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile picture updated successfully!
                  photo_url:
                    type: string
                    example: uploads/profiles/worker_3.jpg

# ==========================================
# COMPONENTS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Paste your JWT token here (without the 'Bearer ' prefix).
        Obtain tokens from `POST /auth.php?action=login` or `POST /auth.php?action=register`.

  schemas:
    StandardResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully.

    AuthSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Login successful!
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserDetail'

    UserDetail:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Sunil Perera
        full_name:
          type: string
          example: Sunil Perera
        username:
          type: string
          example: sunil.electric
        email:
          type: string
          example: sunil.electric@gmail.com
        role:
          type: string
          enum: [customer, worker, admin]
          example: worker
        phone:
          type: string
          example: "+94771234567"
        profile_picture:
          type: string
          nullable: true
          example: uploads/profiles/sunil.jpg
        avatar:
          type: string
          nullable: true
          example: uploads/profiles/sunil.jpg
        worker:
          type: object
          nullable: true

    JobItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 2
        customer_name:
          type: string
          example: Dilshan Silva
        customer_phone:
          type: string
          example: "+94711122334"
        category_id:
          type: integer
          example: 1
        category_name:
          type: string
          example: Electrical & Wiring
        title:
          type: string
          example: Circuit breaker tripping in living room
        description:
          type: string
          example: Main trip switch goes off whenever the air conditioner starts.
        address:
          type: string
          example: 78 Havelock Road, Colombo 05
        latitude:
          type: number
          example: 6.8912
        longitude:
          type: number
          example: 79.8634
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]
          example: open
        created_at:
          type: string
          example: "2026-10-01 14:30:00"

    WorkerProfileItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 3
        full_name:
          type: string
          example: Sunil Perera
        phone:
          type: string
          example: "+94771234567"
        bio:
          type: string
          example: Professional electrician with 10+ years experience.
        address:
          type: string
          example: Colombo 03
        is_verified:
          type: boolean
          example: true
        verification_status:
          type: string
          enum: [unverified, pending, verified, rejected]
          example: verified
        service_radius_km:
          type: integer
          example: 25
        avg_rating:
          type: number
          example: 4.8
        review_count:
          type: integer
          example: 14
        categories:
          type: array
          items:
            type: object
        services:
          type: array
          items:
            type: object

    KycDocumentItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        worker_id:
          type: integer
          example: 1
        worker_name:
          type: string
          example: Sunil Perera
        worker_email:
          type: string
          example: sunil.electric@gmail.com
        document_type:
          type: string
          enum: [nic, driving_license, trade_certificate, police_report, selfie]
          example: nic
        document_name:
          type: string
          example: "National Identity Card (NIC: 198512345678)"
        file_path:
          type: string
          example: uploads/kyc/nic_1_abc123.jpg
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        admin_notes:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          example: "2026-10-02 10:15:00"

    MessageItem:
      type: object
      properties:
        id:
          type: integer
          example: 42
        sender_id:
          type: integer
          example: 2
        receiver_id:
          type: integer
          example: 3
        job_id:
          type: integer
          nullable: true
          example: 1
        message_text:
          type: string
          example: Hello Mr. Sunil, are you available for an electrical inspection?
        is_read:
          type: integer
          example: 0
        created_at:
          type: string
          example: "2026-10-08 09:20:00"

    NotificationItem:
      type: object
      properties:
        id:
          type: integer
          example: 10
        user_id:
          type: integer
          example: 3
        title:
          type: string
          example: KYC Verification Approved
        message:
          type: string
          example: Congratulations! Your identity document has been verified.
        type:
          type: string
          example: kyc
        is_read:
          type: integer
          example: 0
        created_at:
          type: string
          example: "2026-10-08 08:00:00"

  responses:
    400Error:
      description: Bad Request / Validation Failure
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Validation error or missing mandatory parameter.

    401Unauthorized:
      description: Authentication required or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Unauthorized. Please provide a valid Bearer token.

    403Forbidden:
      description: Insufficient role permissions or unverified account
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Forbidden. Only verified workers or administrators may perform this action.

    404NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Resource not found.

    409Conflict:
      description: Data conflict (e.g. email or username already registered)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: A user with this email address already exists.
