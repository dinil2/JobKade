                  enum: [nic, driving_license, trade_certificate, police_report, selfie]
                  example: nic
                document_name:
                  type: string
                  example: National Identity Card - Sunil Perera
                kyc_file:
                  type: string
                  format: binary
                  description: Document file (PDF, PNG, JPG, JPEG, max 5MB)
          application/json:
            schema:
              type: object
              required:
                - document_type
              properties:
                document_type:
                  type: string
                  enum: [nic, driving_license, trade_certificate, police_report, selfie]
                  example: trade_certificate
                document_name:
                  type: string
                  example: NVQ Level 4 Electrical Technician Certificate
                file_path:
                  type: string
                  example: uploads/kyc/doc_sample_123.pdf
      responses:
        '201':
          description: KYC document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: KYC document submitted successfully and pending admin approval!
