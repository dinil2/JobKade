<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — JobKade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header"><h1>My Profile</h1><p>Update your professional profile to attract more customers.</p></div>

      <div class="profile-form-card" style="max-width:700px;">
        <div class="profile-form-header">
          <div class="avatar-wrapper-relative">
            <div class="avatar-upload-container" id="profile-avatar-clickable" title="Click on profile image to upload new photo">
              <img id="worker-avatar-img" class="avatar-img-preview" src="" alt="Profile Photo" style="display:none;">
              <div id="worker-avatar-initials" class="avatar-initials-fallback avatar-blue">--</div>
              <div class="avatar-hover-scrim">
                <i data-lucide="camera" width="24" height="24"></i>
                <span style="font-size:0.7rem; font-weight:700; margin-top:4px; letter-spacing:0.5px; text-transform:uppercase;">Change</span>
              </div>
            </div>
            <button type="button" id="btn-camera-trigger" class="avatar-camera-btn" aria-label="Upload Photo" title="Click to upload profile photo">
              <i data-lucide="camera" width="16" height="16"></i>
            </button>
            <input type="file" id="worker-photo-upload" accept="image/png, image/jpeg, image/jpg" style="display:none;">
          </div>
          <div>
            <h3 id="worker-profile-display-name">Worker Profile</h3>
            <p class="text-sm" style="margin-top:4px; display:flex; align-items:center; gap:8px;">
              <span id="worker-profile-verify-badge" class="badge badge-verified"><i data-lucide="check" width="10" height="10"></i> Verified</span>
              <span style="font-size:0.78rem; color:var(--text-secondary); cursor:pointer;" id="profile-avatar-hint">
                <i data-lucide="upload" width="12" height="12" style="vertical-align:middle; margin-right:3px;"></i> Click photo to change
              </span>
            </p>
            <div style="margin-top:8px;">
              <button type="button" id="btn-change-photo-text" class="btn btn-outline btn-sm" style="display:inline-flex; align-items:center; gap:6px; font-size:0.8rem; padding:6px 12px;">
                <i data-lucide="camera" width="14" height="14"></i> Change profile photo
              </button>
            </div>
          </div>
        </div>

        <form id="worker-profile-form">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Full Name <span>*</span></label><input type="text" name="full-name" class="form-input" placeholder="Your full name" required></div>
            <div class="form-group"><label class="form-label">Phone <span>*</span></label><input type="tel" name="phone" class="form-input" placeholder="e.g. +94 77 123 4567" required></div>
          </div>
          <div class="form-group"><label class="form-label">Email <span>*</span></label><input type="email" name="email" class="form-input" placeholder="Your email address" required></div>
          <div class="form-group"><label class="form-label">Description / Bio <span>*</span></label><textarea name="bio" class="form-textarea" placeholder="Tell customers about your skills, experience, and services..." required></textarea></div>
          <div class="form-group"><label class="form-label">Service Category <span>*</span></label><select name="category" class="form-select"><option value="">Select Category</option><option>Electrical</option><option>Plumbing</option><option>AC Repair</option><option>Carpentry</option><option>Painting</option><option>Cleaning</option><option>Appliance Repair</option><option>Masonry</option></select></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Service Location <span>*</span></label><input type="text" name="location" class="form-input" placeholder="e.g. Colombo, Western Province" required></div>
            <div class="form-group"><label class="form-label">Experience</label><input type="text" name="experience" class="form-input" placeholder="e.g. 5+ years"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Availability</label>
            <select class="form-select" id="availability-status">
              <option value="Available" selected>🟢 Available</option>
              <option value="Busy">🟠 Busy</option>
              <option value="Offline">⚫ Offline</option>
            </select>
          </div>

          <!-- Account Security & Change Password Section -->
          <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);">
            <h4 style="margin: 0 0 6px; font-size: 1rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
              <i data-lucide="lock" width="18" height="18" style="color: var(--warning);"></i>
              Change Password & Account Security
            </h4>
            <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 16px;">
              Leave blank if you do not want to change your password.
            </p>

            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" id="worker-current-password" class="form-input" placeholder="Enter current password to authorize change">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="worker-new-password" class="form-input" placeholder="New password (min 6 characters)">
              </div>
              <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="worker-confirm-password" class="form-input" placeholder="Confirm new password">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 8px;"><i data-lucide="save" width="18" height="18"></i> Save Changes</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/worker.js"></script>
</body>
</html>
