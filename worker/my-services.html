<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Services — JobKade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/worker.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="services-header">
        <div><h1>My Services</h1><p>Manage your service listings and professional gigs.</p></div>
        <a href="add-service.html" class="btn btn-primary"><i data-lucide="plus" width="18" height="18"></i> Add New Service</a>
      </div>

      <div class="services-grid" id="worker-services-container">
        <div class="empty-state" id="worker-services-loading" style="text-align:center; padding: 40px 16px; grid-column: 1 / -1;">
          <i data-lucide="loader" class="spin" style="width: 32px; height: 32px; color: var(--primary); margin-bottom: 12px;"></i>
          <p style="color: var(--text-secondary);">Loading your services...</p>
        </div>
      </div>

      <!-- Delete Confirmation Modal -->
      <div class="modal-overlay" id="delete-service-modal">
        <div class="modal">
          <div class="modal-header"><h3>Delete Service</h3><button class="modal-close"><i data-lucide="x" width="20" height="20"></i></button></div>
          <div class="modal-body"><div class="modal-confirm-icon warning"><i data-lucide="alert-triangle"></i></div><p class="text-center">Are you sure you want to delete this service? This action cannot be undone.</p></div>
          <div class="modal-footer"><button class="btn btn-secondary" data-dismiss="modal">Cancel</button><button class="btn btn-danger" id="confirm-delete-service">Delete Service</button></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/worker.js"></script>
</body>
</html>
