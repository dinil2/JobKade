<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Workers — JobKade Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <h1>Manage Registered Workers</h1>
        <p>View, manage, and moderate all registered skilled service providers.</p>
      </div>

      <div class="table-card">
        <div class="table-header">
          <div class="search-bar-small">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" id="worker-search-input" class="table-search" placeholder="Search workers by name, profession, or location..." aria-label="Search">
          </div>
          <div class="btn-group">
            <select class="form-select" id="worker-category-filter" style="width:160px;" aria-label="Category filter">
              <option value="">All Categories</option>
            </select>
            <select class="form-select" id="worker-status-filter" style="width:140px;" aria-label="Status filter">
              <option value="">All Statuses</option>
              <option value="verified">Verified</option>
              <option value="pending">Pending</option>
              <option value="suspended">Suspended</option>
              <option value="unverified">Unverified</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Worker</th>
                <th>Category</th>
                <th>Location</th>
                <th>Rating</th>
                <th>Verification</th>
                <th>Subscription</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="manage-workers-tbody">
              <tr>
                <td colspan="7" style="text-align:center;padding:2.5rem;color:var(--text-secondary);">
                  <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                    <i data-lucide="loader" width="18" height="18" class="spin"></i>
                    <span>Loading registered workers...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
