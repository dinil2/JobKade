<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Moderation — JobKade Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function(){
      function purge(){
        document.querySelectorAll('a[href*="analytics.html"]').forEach(function(el){
          el.remove();
        });
      }
      purge();
      document.addEventListener('DOMContentLoaded', purge);
      if(typeof MutationObserver!=='undefined'){
        new MutationObserver(purge).observe(document.documentElement,{childList:true,subtree:true});
      }
    })();
  </script>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <h1>Content Moderation & Reports</h1>
        <p>Review user reports, flagged reviews, and inappropriate content across the platform.</p>
      </div>

      <div class="tabs" id="moderationTabs" style="display:flex; gap:8px; margin-bottom:20px;">
        <button class="tab active" data-tab="pending" onclick="switchModerationTab('pending')">Pending (<span id="count-pending">0</span>)</button>
        <button class="tab" data-tab="dismissed" onclick="switchModerationTab('dismissed')">Dismissed (<span id="count-dismissed">0</span>)</button>
        <button class="tab" data-tab="resolved" onclick="switchModerationTab('resolved')">Resolved (<span id="count-resolved">0</span>)</button>
      </div>

      <div id="reportsContainer" style="display:flex; flex-direction:column; gap:16px;">
        <div style="text-align:center; padding:48px 16px; color:var(--text-muted); background:var(--white); border:1px solid var(--border); border-radius:var(--radius-md);">
          Loading reports...
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js?v=8"></script>
  <script src="../js/admin.js?v=8"></script>
</body>
</html>
