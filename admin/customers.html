<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers — JobKade Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../js/lucide.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function(){
      function purge(){
        document.querySelectorAll('a[href*="analytics.html"]').forEach(function(el){
          el.remove();
        });
      }
      purge();
      document.addEventListener('DOMContentLoaded', purge);
      if(typeof MutationObserver!=='undefined'){
        new MutationObserver(purge).observe(document.documentElement,{childList:true,subtree:true});
      }
    })();
  </script>
</head>
<body>
  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <h1>Manage Registered Customers</h1>
        <p>View registered customer accounts, posted jobs history, and account statuses.</p>
      </div>

      <div class="table-card">
        <div class="table-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding: 16px 20px;">
          <div class="search-bar-small" style="max-width: 280px;">
            <i data-lucide="search" width="16" height="16"></i>
            <input type="text" id="customer-search-input" class="table-search" placeholder="Search customers by name, email or city..." aria-label="Search">
          </div>
          <div>
            <select class="form-select" id="customer-status-filter" style="width:140px; font-size:0.85rem;" aria-label="Status filter">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Phone</th>
                <th>Location</th>
                <th style="text-align:right;">Jobs Posted</th>
                <th style="text-align:right;">Jobs Completed</th>
                <th>Joined Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="manage-customers-tbody">
              <tr>
                <td colspan="8" style="text-align:center;padding:2.5rem;color:var(--text-secondary);">
                  <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                    <i data-lucide="loader" width="18" height="18" class="spin"></i>
                    <span>Loading registered customers...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js?v=3"></script>
  <script src="../js/admin.js?v=3"></script>
</body>
</html>
